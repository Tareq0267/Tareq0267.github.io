<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhoAmI — Kuiz Kelas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --field:rgba(6,10,20,.55); --panel:rgba(22,29,46,.74); --panel2:rgba(255,255,255,.07); --line:rgba(255,255,255,.1);
  --text:#eef1f7; --mute:#8d97ab; --accent:#6d5cff; --hl:#8fb3ff; --hot:#ffb07a;
  --blob1:#2f5bff; --blob2:#7a4dff; --blob3:#1ea5ff; --blobop:.42;
  --a:#3f7dff; --b:#f5a00b; --c:#14b37d; --d:#f0476b; --ok:#22c58b; --bad:#ff5a7a;
  --gold:#ffcf4a; --silver:#cfd8ea; --bronze:#e0995e;
  --rh:clamp(54px,8.6vh,86px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#eef3ff; --field:rgba(255,255,255,.85); --panel:rgba(255,255,255,.8); --panel2:rgba(20,40,90,.06); --line:rgba(20,40,90,.13);
  --text:#131a2c; --mute:#5a6580; --hl:#2f5bd8; --hot:#c2570c;
  --blob1:#86a8ff; --blob2:#b7a3ff; --blob3:#7fd0ff; --blobop:.6;
  --silver:#b9c3d6; color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3ff; --field:rgba(255,255,255,.85); --panel:rgba(255,255,255,.8); --panel2:rgba(20,40,90,.06); --line:rgba(20,40,90,.13);
    --text:#131a2c; --mute:#5a6580; --hl:#2f5bd8; --hot:#c2570c;
    --blob1:#86a8ff; --blob2:#b7a3ff; --blob3:#7fd0ff; --blobop:.6;
    --silver:#b9c3d6; color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* slow drifting colour glows behind everything */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);transition:background .4s}
.bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:var(--blobop);transition:opacity .4s}
.bgfx i:nth-child(1){background:radial-gradient(circle,var(--blob1) 0%,transparent 62%);top:-30vmax;left:-20vmax;animation:drift1 26s ease-in-out infinite alternate}
.bgfx i:nth-child(2){background:radial-gradient(circle,var(--blob2) 0%,transparent 62%);bottom:-35vmax;right:-20vmax;animation:drift2 32s ease-in-out infinite alternate}
.bgfx i:nth-child(3){background:radial-gradient(circle,var(--blob3) 0%,transparent 62%);top:20%;left:35%;width:50vmax;height:50vmax;animation:drift3 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(28vw,22vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-30vw,-18vh) scale(1.1)}}
@keyframes drift3{to{transform:translate(-28vw,18vh) scale(.8)}}
@media (prefers-reduced-motion:reduce){.bgfx i{animation:none}}
body{background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
kbd{font:inherit;font-size:.72em;font-weight:700;padding:.1em .45em;border-radius:6px;background:var(--panel2);border:1px solid var(--line)}
#app{height:100vh;width:100vw}
.screen{height:100%;width:100%;display:flex;flex-direction:column;padding:clamp(16px,3vh,36px) clamp(20px,3vw,56px);animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* global controls */
.ctrls{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;z-index:50;opacity:.55;transition:opacity .2s}
.ctrls:hover{opacity:1}
.ctrls button{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.ctrls svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* brand */
.mark{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:44px;height:44px}
.mark i{border-radius:5px}
.mark.sm{width:20px;height:20px;gap:2px}
.mark.sm i{border-radius:2px}
.logo{font-weight:800;font-size:clamp(54px,7vw,104px);line-height:1;letter-spacing:-.03em;color:var(--text)}
.brand-sm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.btn{padding:14px 26px;border-radius:14px;font-weight:700;font-size:18px;background:var(--panel2);border:1px solid var(--line);transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px);border-color:var(--mute)}
.btn.primary{background:var(--accent);border:0}
.btn.primary:hover{background:#7d6eff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* pose svg */
.pose{width:100%;height:100%;display:block}
.pose .body{fill:currentColor}
.pose .tbl{fill:currentColor;opacity:.28}
.pose .arm{stroke:currentColor;stroke-width:8;fill:none;stroke-linecap:round;opacity:.4}
.pose .hand{fill:currentColor;opacity:.4}
.pose .on{opacity:1}
.pose .thumb{stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.pose .fl{stroke:rgba(0,0,0,.22);stroke-width:1;stroke-linecap:round;fill:none}

/* ---------- LOBBY ---------- */
.lobby{justify-content:center}
.lob{flex:1;display:flex;align-items:center;gap:clamp(28px,5vw,96px);max-width:1360px;width:100%;margin:0 auto}
.hero{flex:1.1;display:flex;flex-direction:column;gap:22px}
.hero .top{display:flex;align-items:center;gap:18px}
.hero .tag{font-size:clamp(17px,1.5vw,24px);color:var(--mute);max-width:32ch;line-height:1.5;font-weight:500}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin-top:6px}
.lg{display:flex;align-items:center;gap:14px;padding:10px 14px 10px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);animation:fadeIn .5s both}
.lg:nth-child(2){animation-delay:.08s}.lg:nth-child(3){animation-delay:.16s}.lg:nth-child(4){animation-delay:.24s}
.lg .ic{flex:none;width:clamp(48px,4.4vw,64px);aspect-ratio:1;border-radius:10px;padding:5px;color:#fff}
.lg b{display:block;font-size:20px;font-weight:800}
.lg span{font-size:14px;color:var(--mute);font-weight:600}
.panel{flex:1;max-width:520px;padding:28px;display:flex;flex-direction:column;gap:18px}
.panel .ph{display:flex;align-items:baseline;justify-content:space-between}
.panel .ph h2{font-size:22px;font-weight:800}
.panel .ph span{color:var(--mute);font-size:14px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;justify-content:space-between}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:30vh;overflow:auto}
.trow{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px;transition:border-color .15s}
.trow:focus-within{border-color:var(--accent)}
.trow .sw{width:12px;height:12px;border-radius:4px;flex:none}
.trow input{flex:1;min-width:0;background:none;border:0;outline:0;font-weight:600;font-size:16px;padding:7px 0}
.trow input::placeholder{color:var(--mute);opacity:.75;font-weight:500}
.trow button{width:26px;height:26px;border-radius:7px;color:var(--mute);font-size:13px}
.trow button:hover{background:var(--panel2);color:var(--text)}
.addt{padding:9px;border-radius:10px;border:1px dashed var(--line);color:var(--mute);font-weight:600;font-size:15px}
.addt:hover{color:var(--text);border-color:var(--mute)}
.seg{display:flex;gap:4px;padding:4px;background:var(--field);border:1px solid var(--line);border-radius:12px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{padding:10px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.sum b{display:block;font-size:22px;font-weight:800}
.sum span{font-size:12px;color:var(--mute);font-weight:600}
.panel .btn{width:100%}
.lfoot{padding-right:170px;display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 -12px -10px;color:var(--mute);font-size:14px;font-weight:600}

/* ---------- HOWTO ---------- */
.howto{gap:clamp(14px,2.4vh,28px);justify-content:center}
.howto h2{font-size:clamp(28px,3vw,46px);font-weight:800}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{padding:20px 22px;display:flex;gap:16px;align-items:flex-start}
.step .n{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--panel2)}
.step h4{font-size:clamp(18px,1.5vw,24px);font-weight:800;margin-bottom:4px;letter-spacing:.04em}
.step p{color:var(--mute);font-size:clamp(14px,1.05vw,17px);line-height:1.45}
.gest{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.g{border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.g .ic{width:min(100%,130px);aspect-ratio:1}
.g b{font-size:clamp(20px,1.8vw,28px);font-weight:800}
.g span{font-size:clamp(13px,1vw,16px);font-weight:600;opacity:.92;line-height:1.3}
.gsub{color:var(--mute);font-size:14px;margin-top:-6px}
.howto .go{display:flex;align-items:center;gap:18px}

/* ---------- QUESTION ---------- */
.q{gap:clamp(12px,2vh,22px)}
.qbar{display:flex;align-items:center;gap:18px}
.qcount{font-weight:700;color:var(--mute);font-size:18px;white-space:nowrap}
.qcount b{color:var(--text)}
.prog{flex:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.pill{font-weight:800;letter-spacing:.14em;font-size:15px;padding:8px 16px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;min-width:132px;justify-content:center}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.phase-think .pill{color:var(--hl)}.phase-count .pill{color:var(--b)}.phase-show .pill{color:#fff;background:var(--accent)}.phase-reveal .pill{color:var(--ok)}
.exit{color:var(--mute);font-weight:600;font-size:14px;padding:8px 12px;border-radius:10px}
.exit:hover{background:var(--panel2);color:var(--text)}
.exit.sure{color:var(--bad);background:rgba(255,90,122,.12)}
.bonus{align-self:center;font-weight:800;letter-spacing:.12em;font-size:14px;padding:6px 16px;border-radius:99px;background:var(--gold);color:#2a1500}

.qmain{flex:1;min-height:0;display:flex;gap:clamp(16px,2vw,32px);align-items:stretch;position:relative}
.qcard{flex:1;min-width:0;padding:clamp(20px,3vh,40px) clamp(24px,3vw,48px);display:flex;gap:clamp(16px,2vw,32px);transition:opacity .3s}
.qcol{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
.qimg{flex:none;width:clamp(200px,26vw,440px);display:flex;flex-direction:column;gap:6px;min-height:0}
.qimg img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:14px;animation:fadeIn .5s}
.qimg figcaption{font-size:11px;color:var(--mute);font-weight:600;text-align:right}
.has-img .qtext{font-size:clamp(22px,2.5vw,44px)}
.topic{align-self:flex-start;font-size:clamp(14px,1.1vw,17px);font-weight:700;color:var(--mute);padding:8px 14px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.qtype{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.qtext{font-size:clamp(26px,3.1vw,54px);font-weight:800;line-height:1.22;letter-spacing:-.01em}
.qexp{font-size:clamp(16px,1.3vw,22px);color:var(--text);line-height:1.45;border-left:4px solid var(--ok);padding:4px 0 4px 14px;display:none}
.phase-reveal .qexp{display:block;animation:fadeIn .4s}
.timer{flex:none;width:clamp(130px,13vw,210px);display:grid;place-items:center;position:relative;transition:opacity .3s}
.timer svg{width:100%;transform:rotate(-90deg)}
.timer .trk{stroke:var(--panel2);stroke-width:8;fill:none}
.timer .rng{stroke:var(--hl);stroke-width:8;fill:none;stroke-linecap:round;transition:stroke-dashoffset .1s linear,stroke .3s}
.timer.urgent .rng{stroke:var(--bad)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(40px,4.4vw,74px);font-weight:800;font-variant-numeric:tabular-nums}
.timer.urgent .num{color:var(--bad);animation:pulse .5s ease infinite alternate}
@keyframes pulse{to{transform:scale(1.07)}}
.phase-count .timer,.phase-show .timer,.phase-reveal .timer{opacity:0}
.phase-count .qcard,.phase-show .qcard{opacity:.12}

.stage{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;pointer-events:none}
.phase-count .stage,.phase-show .stage{display:flex}
.cnum{font-size:clamp(120px,18vh,220px);font-weight:800;line-height:1;animation:pop .8s ease both}
@keyframes pop{0%{transform:scale(1.6);opacity:0}25%{transform:scale(1);opacity:1}85%{opacity:1}100%{transform:scale(.85);opacity:0}}
.csub{font-size:clamp(18px,1.6vw,26px);font-weight:700;color:var(--mute);letter-spacing:.06em}
.sword{font-size:clamp(90px,14vh,180px);font-weight:800;letter-spacing:.04em;line-height:1;color:var(--text);animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.hold{width:min(420px,60%);height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.hold i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;animation:drain 3s linear both}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.opts{display:grid;gap:clamp(10px,1.4vw,18px);grid-template-columns:1fr 1fr;flex:none}
.opt{--tile:var(--a);background:var(--tile);border-radius:20px;display:flex;align-items:center;gap:clamp(12px,1.4vw,22px);padding:clamp(12px,1.6vh,20px) clamp(14px,1.6vw,24px);
  min-height:clamp(96px,15vh,160px);position:relative;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);
  transition:transform .35s,opacity .35s,filter .35s,box-shadow .35s;animation:tileIn .5s cubic-bezier(.2,1.2,.4,1) both}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
@keyframes tileIn{from{opacity:0;transform:translateY(16px) scale(.97)}}
.opt .ic{flex:none;height:clamp(70px,11vh,124px);aspect-ratio:1;background:rgba(0,0,0,.16);border-radius:16px;padding:6px}
.opt .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.opt .gs{font-size:clamp(12px,.95vw,15px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.opt .tx{font-size:clamp(20px,1.9vw,32px);font-weight:700;line-height:1.2}
.opt .lt{flex:none;font-size:clamp(30px,3vw,50px);font-weight:800;opacity:.9;width:1.3em;text-align:center}
.opt .mk{position:absolute;top:-12px;right:-12px;width:46px;height:46px;border-radius:50%;background:#fff;display:none;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.opt .mk svg{width:26px;height:26px;stroke:var(--ok);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.opts.tf .opt{min-height:clamp(130px,22vh,230px)}
.opts.tf .tx{font-size:clamp(30px,3vw,52px);font-weight:800;letter-spacing:.05em}
.phase-show .opt{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 4px rgba(255,255,255,.35)}}
.opt.wrong{opacity:.22;filter:grayscale(.7);transform:scale(.97)}
.opt.right{transform:scale(1.02);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 0 0 5px #fff,0 18px 50px -12px var(--tile)}
.opt.right .mk{display:grid;animation:slam .4s cubic-bezier(.2,1.6,.4,1)}

.qfoot{padding-right:170px;flex:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hint{color:var(--mute);font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.say{font-size:clamp(16px,1.3vw,22px);font-weight:700}
.say em{font-style:normal;color:var(--hl)}
.mark-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;animation:fadeIn .4s}
.mark-row .ml{font-weight:700;color:var(--mute);font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{--tc:#fff;display:flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:16px;transition:all .15s}
.chip .dot{width:12px;height:12px;border-radius:4px;background:var(--tc)}
.chip .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent}
.chip.on{border-color:var(--ok);background:rgba(34,197,139,.14)}
.chip.on .ck{background:var(--ok);border-color:var(--ok);color:#06261a}

/* ---------- LEADERBOARD ---------- */
.lb{align-items:center;gap:clamp(12px,2vh,22px)}
.lbh{width:min(1000px,100%);display:flex;align-items:flex-end;justify-content:space-between}
.lbh h2{font-size:clamp(30px,3.2vw,52px);font-weight:800}
.lbh span{color:var(--mute);font-weight:600;font-size:17px}
.callout{width:min(1000px,100%);padding:14px 20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:clamp(16px,1.3vw,21px);animation:fadeIn .5s .2s both}
.lbl{width:min(1000px,100%);position:relative;flex:none}
.row{--r:0;position:absolute;left:0;right:0;top:0;height:var(--rh);transform:translateY(calc(var(--r) * (var(--rh) + 10px)));
  transition:transform .9s cubic-bezier(.6,0,.2,1);display:flex;align-items:center;gap:18px;padding:0 24px 0 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;font-weight:700}
.row .rk{width:calc(var(--rh) - 22px);height:calc(var(--rh) - 22px);border-radius:12px;display:grid;place-items:center;font-size:clamp(18px,1.6vw,26px);font-weight:800;background:var(--panel2)}
.row.r0 .rk{background:var(--gold);color:#2a1d00}.row.r1 .rk{background:var(--silver);color:#1a2030}.row.r2 .rk{background:var(--bronze);color:#2a1200}
.row .sw{width:6px;height:55%;border-radius:4px;background:var(--tc)}
.row .nm{flex:1;font-size:clamp(20px,1.8vw,30px);display:flex;align-items:center;gap:12px;min-width:0}
.stk{font-size:.6em;padding:4px 10px;border-radius:99px;background:rgba(255,138,74,.16);color:var(--hot);white-space:nowrap}
.row .gn{font-size:clamp(16px,1.3vw,22px);color:var(--ok);min-width:5em;text-align:right;opacity:0;transition:opacity .4s}
.row .gn.zero{color:var(--mute)}
.lbl.go .gn{opacity:1}
.row .sc{font-size:clamp(22px,2vw,34px);font-weight:800;min-width:4.5em;text-align:right;font-variant-numeric:tabular-nums}
.lbf{margin-top:auto}

/* ---------- FINAL ---------- */
.fin{align-items:center;gap:clamp(10px,2vh,24px)}
.fin h2{font-size:clamp(30px,3.4vw,56px);font-weight:800}
.fin .sub{color:var(--mute);font-size:18px;font-weight:600;margin-top:-8px}
.pod{display:flex;align-items:flex-end;gap:clamp(12px,2vw,28px);height:44vh;margin-top:10px}
.pc{width:clamp(150px,16vw,250px);display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;justify-content:flex-end}
.pc .pn{font-size:clamp(20px,1.9vw,32px);font-weight:800;text-align:center}
.pc .ps{font-size:clamp(16px,1.4vw,22px);color:var(--mute);font-weight:700}

/* ---------------- pose drawings (seen from behind) ---------------- */
function figure(k){
  const arms = {
    Lr:{d:'M34 62 Q23 72 29 83', e:[29,83]}, Rr:{d:'M66 62 Q77 72 71 83', e:[71,83]},
    Lu:{d:'M34 62 Q24 42 27 13', e:[27,13]}, Ru:{d:'M66 62 Q76 42 73 13', e:[73,13]},
    Lh:{d:'M34 62 Q14 46 41 29', e:[41,29]}, Rh:{d:'M66 62 Q86 46 59 29', e:[59,29]},
  };
  let L=arms.Lr, R=arms.Rr, lo=false, ro=false;
  if(k==='A'){L=arms.Lu;lo=true}
  if(k==='B'){R=arms.Ru;ro=true}
  if(k==='C'){L=arms.Lu;R=arms.Ru;lo=ro=true}
  if(k==='D'){L=arms.Lh;R=arms.Rh;lo=ro=true}
  const arm=(a,on)=>`<path class="arm ${on?'on':''}" d="${a.d}"/><circle class="hand ${on?'on':''}" cx="${a.e[0]}" cy="${a.e[1]}" r="5.5"/>`;

    <rect class="tbl" x="6" y="85" width="88" height="7" rx="3.5"/>
    <path class="body" d="M28 87 Q28 58 50 56 Q72 58 72 87 Z"/>
    <circle class="body" cx="50" cy="40" r="11"/>
    ${arm(L,lo)}${arm(R,ro)}</svg>`;
}
// Flat white hand in the same style as the figures (sleeve dimmed like the table/resting arms)
function thumb(down){

}

const Snd = {
  ctx:null, on:true,
  init(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f, dur, type='sine', vol=.15, delay=0, to=null){
    if(!this.on||!this.ctx) return;
    const t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur+.02);
  },
  tick(urgent){ this.tone(urgent?1500:1100,.05,'square',urgent?.06:.035); },
  count(){ this.tone(660,.18,'triangle',.2); },
  show(){ this.tone(130,.6,'sawtooth',.18,0,60); this.tone(523,.35,'triangle',.18); this.tone(784,.35,'triangle',.14); this.tone(1046,.4,'triangle',.1); },
  reveal(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.3,'triangle',.16,i*.08)); },
  click(){ this.tone(880,.06,'sine',.08); },
  whoosh(){ this.tone(300,.5,'sine',.1,0,900); },
  fanfare(){ [523,659,784,659,784,1046].forEach((f,i)=>this.tone(f,.35,'triangle',.17,i*.14)); },
};

let BANK = [];        // every question in the bank, sorted by .order
let QUESTIONS = [];   // the questions used for the current game
const uid = () => 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const imgSrc = s => /^(data:|https?:)/.test(s) ? s : 'img/' + s;
const selected = () => BANK.filter(q => q.on);
const sortBank = () => BANK.sort((a,b) => a.order - b.order);
const nextOrder = () => BANK.reduce((m,q) => Math.max(m,q.order), -1) + 1;
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const SEED_VERSION = 2;   // bump when DEFAULT_QUESTIONS change so existing browsers pick up the update
const seedDefaults = () => DEFAULT_QUESTIONS.map((q,i) => ({...q, order:i, on:true, custom:false}));
// Bring built-in questions up to date without touching the teacher's own or edited questions.
async function migrateDefaults(){
  const v = (await Store.get('seedVersion')) || 1;
  if(v >= SEED_VERSION) return;
  const defs = seedDefaults(), ids = new Set(defs.map(d=>d.id));
  const cur = await Store.all(), byId = new Map(cur.map(q=>[q.id,q]));
  for(const q of cur) if(!q.custom && !q.edited && /^d\d+$/.test(q.id) && !ids.has(q.id)) await Store.del(q.id);
  const upd = defs.filter(d=>{ const o=byId.get(d.id); return o && !o.edited; }).map(d=>{ const o=byId.get(d.id); return {...d, on:o.on, order:o.order}; });
  if(upd.length) await Store.put(...upd);
  await Store.set('seedVersion', SEED_VERSION);
}

// Survives refresh and browser restarts. Falls back to memory if IndexedDB is unavailable (e.g. some private modes).
const Store = {
  db:null, mem:{q:new Map(), m:new Map()},
  async open(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('alvyquiz', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('questions',{keyPath:'id'}); r.result.createObjectStore('meta'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
      try{ navigator.storage?.persist?.(); }catch(e){}
    }catch(e){ this.db = null; }
  },
  run(store, mode, fn){
    return new Promise((res,rej)=>{
      const tx = this.db.transaction(store, mode), r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      tx.onerror = tx.onabort = () => rej(tx.error);
    });
  },
  all(){ return this.db ? this.run('questions','readonly',s=>s.getAll()) : Promise.resolve([...this.mem.q.values()]); },
  put(...qs){ if(!this.db){ qs.forEach(q=>this.mem.q.set(q.id,q)); return Promise.resolve(); } return this.run('questions','readwrite',s=>{ qs.forEach(q=>s.put(q)); }); },
  del(id){ if(!this.db){ this.mem.q.delete(id); return Promise.resolve(); } return this.run('questions','readwrite',s=>s.delete(id)); },
  clear(){ if(!this.db){ this.mem.q.clear(); return Promise.resolve(); } return this.run('questions','readwrite',s=>s.clear()); },
  get(k){ return this.db ? this.run('meta','readonly',s=>s.get(k)) : Promise.resolve(this.mem.m.get(k)); },
  set(k,v){ if(!this.db){ this.mem.m.set(k,v); return Promise.resolve(); } return this.run('meta','readwrite',s=>s.put(v,k)); },
};

function toast(msg){
  $$('.toast').forEach(t=>t.remove());

}
// two-click confirmation instead of browser confirm() dialogs
function confirmClick(btn, label, fn){
  if(btn.classList.contains('sure')) return fn();
  const old=btn.textContent; btn.classList.add('sure'); btn.textContent=label;
  setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('sure'); btn.textContent=old; } }, 2800);
}

async function bankAction(a, q, btn){
  const i=BANK.indexOf(q);
  if(a==='edit') return openEditor(q);
  if(a==='del') return confirmClick(btn, 'Sure?', async()=>{ BANK.splice(i,1); await Store.del(q.id); drawBank(); toast('Question deleted'); });
  const j = a==='up' ? i-1 : i+1;
  if(j<0 || j>=BANK.length) return;
  const o=BANK[j]; [q.order,o.order]=[o.order,q.order]; sortBank();
  await Store.put(q,o); drawBank();
}
async function setAll(v){ BANK.forEach(q=>q.on=v); await Store.put(...BANK); drawBank(); }
async function resetBank(){
  await Store.clear(); BANK=seedDefaults(); await Store.put(...BANK); await Store.set('seedVersion', SEED_VERSION);
  S.bankQ=''; renderBank(); toast('Bank Soalan reset to the original questions');
}

  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}));
  const a=document.createElement('a'); a.href=url; a.download=`whoami-question-bank-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1500);
  toast(`${BANK.length} questions exported`);
}
// imported files are untrusted: keep only known fields, check shapes, cap lengths
function cleanQ(raw){
  if(!raw || typeof raw!=='object') return null;
  const type = raw.type==='tf' ? 'tf' : 'mcq';
  const q = String(raw.q||'').trim(); if(!q) return null;
  const out = {type, q:q.slice(0,400), exp:String(raw.exp||'').trim().slice(0,400), on:raw.on!==false, custom:!!raw.custom};
  if(type==='mcq'){
    const opts=(Array.isArray(raw.opts)?raw.opts:[]).slice(0,4).map(s=>String(s??'').trim().slice(0,160));
    if(opts.length<4 || opts.some(s=>!s)) return null;
    out.opts=opts;
  }
  const ans=Number(raw.ans);
  if(!Number.isInteger(ans) || ans<0 || ans>=(type==='tf'?2:4)) return null;
  out.ans=ans;
  if(typeof raw.img==='string' && (/^data:image\/(jpeg|png|webp|gif);base64,/.test(raw.img) || /^[\w.-]+\.(jpe?g|png|webp|gif)$/i.test(raw.img))) out.img=raw.img;
  if(out.img && raw.credit) out.credit=String(raw.credit).slice(0,120);
  return out;
}
async function importBank(file){
  try{
    const data=JSON.parse(await file.text());
    const arr=Array.isArray(data) ? data : data && data.questions;
    if(!Array.isArray(arr)) throw new Error('bad');
    let ord=nextOrder();
    const qs=arr.map(cleanQ).filter(Boolean).map(q=>({...q, id:uid(), order:ord++}));
    if(!qs.length) return toast('No valid questions found in this file');
    BANK.push(...qs); await Store.put(...qs); drawBank();
    toast(`${qs.length} questions imported` + (qs.length<arr.length ? ` · ${arr.length-qs.length} skipped` : ''));
  }catch(e){ toast('Invalid file. Choose a .json file exported from WhoAmI.'); }
}

let ED=null;
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const s=Math.min(1, 1400/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.82));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src=url;
  });
}

      <div class="f"><label for="eExp">Explanation <small>· shown after the answer is revealed (optional)</small></label><textarea id="eExp" rows="2" maxlength="400"></textarea></div>
      <div class="f"><label>Image <small>· optional</small></label>
        <div class="eimg"><div class="eimg-prev" id="eImgPrev"></div>
          <div class="eimg-side">
            <div class="eimg-btns"><button class="btn sm" id="eImgPick">Choose image…</button><button class="btn sm" id="eImgRm">Remove image</button></div>
            <input type="text" id="eCredit" maxlength="120" placeholder="Image credit (optional)">

  document.body.appendChild(m); S.modal=true;
  $('#eQ').value=ED.q; $('#eExp').value=ED.exp||''; $('#eCredit').value=ED.credit||'';
  $$('.eo input').forEach(inp=>{ inp.value=ED.opts[+inp.dataset.i]||''; inp.oninput=()=>{ ED.opts[+inp.dataset.i]=inp.value; }; });
  $('#eQ').oninput=e=>{ ED.q=e.target.value; };
  $('#eExp').oninput=e=>{ ED.exp=e.target.value; };
  $('#eCredit').oninput=e=>{ ED.credit=e.target.value; };
  $('#eType').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; ED.type=b.dataset.t; if(ED.type==='tf' && ED.ans>1) ED.ans=0; drawEd(); };
  $$('.eo-k').forEach(b=>b.onclick=()=>{ ED.ans=+b.dataset.i; drawEd(); });
  $('#eTfSeg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; ED.ans=+b.dataset.v; drawEd(); };
  $('#eImgPick').onclick=()=>$('#eFile').click();
  $('#eFile').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    try{ ED.img=await shrinkImage(f); $('#eErr').textContent=''; drawEd(); }
    catch(err){ $('#eErr').textContent='Could not read that image. Try a JPG or PNG file.'; }
  };
  $('#eImgRm').onclick=()=>{ delete ED.img; ED.credit=''; $('#eCredit').value=''; drawEd(); };
  $('#mX').onclick=closeEditor; $('#mCancel').onclick=closeEditor;

function drawEd(){
  $$('#eType button').forEach(b=>b.classList.toggle('on', b.dataset.t===ED.type));
  $('#eMcq').style.display = ED.type==='mcq' ? '' : 'none';
  $('#eTf').style.display  = ED.type==='tf'  ? '' : 'none';
  $$('.eo').forEach(o=>o.classList.toggle('ok', +o.dataset.i===ED.ans));
  $$('#eTfSeg button').forEach(b=>b.classList.toggle('on', +b.dataset.v===ED.ans));
  $('#eImgPrev').innerHTML = ED.img ? `<img src="${esc(imgSrc(ED.img))}" alt="">` : 'No image';
  $('#eImgRm').style.display = ED.img ? '' : 'none';
  $('#eCredit').style.display = ED.img ? '' : 'none';
}
function closeEditor(){ $('#modal')?.remove(); S.modal=false; ED=null; }
async function saveEditor(isNew){
  const err=$('#eErr'), q=ED.q.trim();
  if(!q){ err.textContent='Please type the question.'; return $('#eQ').focus(); }
  if(ED.type==='mcq'){
    ED.opts=ED.opts.map(s=>(s||'').trim());
    const miss=ED.opts.findIndex(s=>!s);
    if(miss>=0){ err.textContent=`Please fill in option ${'ABCD'[miss]}.`; return $$('.eo input')[miss].focus(); }
  }
  const out={...ED, q, exp:(ED.exp||'').trim(), credit:(ED.credit||'').trim()};
  if(out.type==='tf') delete out.opts;
  if(!out.img){ delete out.img; delete out.credit; }
  if(!out.credit) delete out.credit;
  if(isNew){ Object.assign(out, {id:uid(), order:nextOrder(), on:true, custom:true}); }
  else if(!out.custom) out.edited=true;
  try{ await Store.put(out); }
  catch(e){ err.textContent='Could not save. Browser storage may be full. Try a smaller image.'; return; }
  if(isNew) BANK.push(out); else BANK[BANK.findIndex(x=>x.id===out.id)]=out;
  closeEditor(); drawBank();
  if(isNew){ const l=$('#bkList'); l.scrollTop=l.scrollHeight; }
  toast(isNew ? 'Question added' : 'Question saved');
}

        </div>
        <div class="sec">
          <h3><span>Soalan</span><span>${selected().length} / ${BANK.length} dipilih</span></h3>
          <div class="qsrow">
            <label class="tog"><input type="checkbox" id="shuf" ${S.shuffle?'checked':''}><span></span>Susunan rawak</label>
          </div>
        </div>
        <div class="sum" id="sum"></div>
        <button class="btn primary" id="next" ${selected().length?'':'disabled'}>${selected().length?'Seterusnya: Cara Main':'Pilih sekurang-kurangnya 1 soalan'}</button>
      </div>
    </div>
    <div class="lfoot"><button class="bankbtn" id="openBank" title="Urus soalan (untuk guru)"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Bank Soalan</button><span class="credit">Developed by TA</span></div>
  </div>`;
  drawTeams();
  $('#addt').onclick=()=>{ if(S.teams.length<8){ S.teams.push(newTeam(S.teams.length)); drawTeams(); saveSettings(); } };
  $('#seg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
    S.timer=+b.dataset.s; $$('#seg button').forEach(x=>x.classList.toggle('on',x===b)); drawSummary(); saveSettings(); };
  $('#shuf').onchange=e=>{ S.shuffle=e.target.checked; saveSettings(); };
  $('#openBank').onclick=()=>{ Snd.init(); Snd.click(); renderBank(); };
  $('#next').onclick=()=>{ if(!selected().length) return; Snd.init(); Snd.click(); renderHowto(); };
}
function drawSummary(){
  const n=selected().length;
  $('#sum').innerHTML = `
    <div><b>${n}</b><span>soalan</span></div>
    <div><b>${S.teams.length}</b><span>peserta</span></div>
    <div><b>~${Math.max(1,Math.round(n*(S.timer+25)/60))}</b><span>minit</span></div>`;
}
function drawTeams(){
  const el=$('#tlist');
  el.innerHTML = S.teams.map((t,i)=>`
    <div class="trow"><span class="sw" style="background:${t.color}"></span>
      <input value="${esc(t.input)}" data-i="${i}" maxlength="18" placeholder="Peserta ${i+1}" aria-label="Nama peserta ${i+1}">
      <button data-rm="${i}" title="Buang" ${S.teams.length<=2?'disabled style="opacity:.25"':''}>✕</button></div>`).join('');
  el.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ S.teams[+inp.dataset.i].input=inp.value; saveSettings(); });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ if(S.teams.length>2){ S.teams.splice(+b.dataset.rm,1); drawTeams(); saveSettings(); } });
  $('#addt').style.display = S.teams.length>=8 ? 'none' : '';
  $('#tcount').textContent = `${S.teams.length} / 8`;
  drawSummary();
}

/* ================= HOW TO PLAY ================= */
function renderHowto(){
  S.screen='howto';
  app.innerHTML = `
  <div class="screen howto">
    <h2>Cara Main</h2>
    <div class="steps">
      <div class="step card"><div class="n" style="color:var(--hl)">1</div><div><h4>FIKIR</h4><p>Baca soalan dan fikir jawapan. Tangan kekal di atas meja. Jangan tunjuk lagi!</p></div></div>
      <div class="step card"><div class="n" style="color:var(--b)">2</div><div><h4>SEDIA</h4><p>Kiraan 3, 2, 1. Kunci jawapan dalam kepala anda.</p></div></div>
      <div class="step card"><div class="n" style="color:var(--accent)">3</div><div><h4>TUNJUK!</h4><p>Semua tunjuk isyarat serentak dan tahan sehingga jawapan didedahkan.</p></div></div>
    </div>
    <div class="gest">${['A','B','C','D','T','F'].map(k=>`
      <div class="g" style="background:${OPT[k].c}"><div class="ic">${poseFor(k)}</div><b>${k==='T'?'BENAR':k==='F'?'SALAH':k}</b><span>${OPT[k].g}</span></div>`).join('')}</div>
    <div class="gsub">Gambar menunjukkan murid dari belakang: kiri di skrin = tangan kiri anda.</div>
    <div class="go">
      <button class="btn primary" id="start">Mula Kuiz</button>
      <button class="btn" id="back">← Kembali</button>
      <span class="hint"><kbd>Space</kbd> untuk mula</span>
    </div>
  </div>`;
  $('#start').onclick=startGame; $('#back').onclick=renderLobby;
}

function startGame(){
  const pool=selected();
  if(!pool.length) return renderLobby();
  QUESTIONS = S.shuffle ? shuffle([...pool]) : [...pool];
  Snd.init(); Snd.click();
  S.teams.forEach((t,i)=>Object.assign(t,{name:t.input.trim()||`Peserta ${i+1}`, score:0,streak:0,best:0,correct:0}));
  S.qi=0; renderQuestion();
}

/* ================= QUESTION ================= */
const CIRC = 2*Math.PI*44;
function renderQuestion(){
  S.screen='question'; clearTimers(); S.marks=new Set(); S.paused=false;
  const q=QUESTIONS[S.qi], n=QUESTIONS.length, last=S.qi===n-1;
  const keys = q.type==='tf' ? ['T','F'] : ['A','B','C','D'];
  const texts = q.type==='tf' ? ['BENAR','SALAH'] : q.opts;
  app.innerHTML = `
  <div class="screen q">
    <div class="qbar">
      <span class="brand-sm">${MARK('sm')}WhoAmI</span>
      <span class="qcount">Soalan <b>${S.qi+1}</b> / ${n}</span>
      <div class="prog"><i style="width:${(S.qi)/n*100}%"></i></div>
      <span class="pill" id="pill">FIKIR</span>
      <button class="exit" id="exit">Keluar</button>
    </div>
    ${last?'<div class="bonus">SOALAN AKHIR · MATA BERGANDA</div>':''}
    <div class="qmain">
      <div class="qcard card ${q.img?'has-img':''}">
        <div class="qcol">
          <span class="qtype">${q.type==='tf'?'Benar atau Salah':'Pilih satu jawapan'}</span>
          <h1 class="qtext">${esc(q.q)}</h1>
          <p class="qexp">${esc(q.exp||EXP)}</p>
        </div>
        ${q.img?`<figure class="qimg"><img src="${esc(imgSrc(q.img))}" alt="" onerror="this.closest('.qcard').classList.remove('has-img');this.parentNode.remove()">${q.credit?`<figcaption>${esc(q.credit)}</figcaption>`:''}</figure>`:''}
      </div>
      <div class="timer" id="timer">
        <svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="44"/><circle class="rng" id="rng" cx="50" cy="50" r="44" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg>
        <div class="num" id="tnum">${S.timer}</div>
      </div>
      <div class="stage" id="stage"></div>
    </div>
    <div class="opts ${q.type==='tf'?'tf':''}">
      ${keys.map((k,i)=>`
        <div class="opt" data-i="${i}" style="--tile:${OPT[k].c}">
          <div class="ic">${poseFor(k)}</div>
          <div class="bd"><span class="gs">${OPT[k].g}</span><span class="tx">${esc(texts[i])}</span></div>
          ${q.type==='tf'?'':`<span class="lt">${k}</span>`}
          <span class="mk"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        </div>`).join('')}
    </div>
    <div class="qfoot" id="foot"></div>
  </div>`;
  const ex=$('#exit');
  ex.onclick=()=>{ if(ex.classList.contains('sure')) renderLobby(); else { ex.classList.add('sure'); ex.textContent='Pasti keluar?'; later(()=>{ex.classList.remove('sure');ex.textContent='Keluar';},2500); } };
  startThink();
}

function setPhase(p){
  S.phase=p;
  const scr=$('.screen.q'); scr.classList.remove('phase-think','phase-count','phase-show','phase-reveal'); scr.classList.add('phase-'+p);
  $('#pill').textContent = {think:'FIKIR',count:'SEDIA',show:'TUNJUK!',reveal:'JAWAPAN'}[p];
  const foot=$('#foot');
  if(p==='think') foot.innerHTML = `<span class="say">Fikir dahulu. <em>Tangan di atas meja.</em></span><span class="hint"><kbd>Space</kbd> skip · <kbd>P</kbd> pause</span>`;
  if(p==='count') foot.innerHTML = `<span class="say">Kunci jawapan anda…</span><span></span>`;
  if(p==='show')  foot.innerHTML = `<span class="say">Tunjuk isyarat sekarang dan <em>tahan!</em></span><span class="hint"><kbd>Space</kbd> tunjuk jawapan</span>`;
}

function startThink(){
  setPhase('think');
  S.remaining=S.timer*1000; let lastT=performance.now(), lastSec=S.timer;
  updateRing();
  S.iv=setInterval(()=>{
    const now=performance.now(), dt=now-lastT; lastT=now;
    if(S.paused) return;
    S.remaining-=dt;
    const sec=Math.max(0,Math.ceil(S.remaining/1000));
    if(sec!==lastSec){ lastSec=sec; if(sec>0) Snd.tick(sec<=5); }
    updateRing();
    if(S.remaining<=0){ clearInterval(S.iv); S.iv=null; startCount(); }
  },50);
}
function updateRing(){
  const frac=Math.max(0,S.remaining)/(S.timer*1000), sec=Math.max(0,Math.ceil(S.remaining/1000));
  $('#rng').style.strokeDashoffset = CIRC*(1-frac);
  $('#tnum').textContent = S.paused ? '❚❚' : sec;
  $('#timer').classList.toggle('urgent', sec<=5 && !S.paused);
}

function startCount(){
  clearInterval(S.iv); S.iv=null; setPhase('count');
  const st=$('#stage');
  [3,2,1].forEach((n,i)=>later(()=>{
    st.innerHTML=`<div class="cnum">${n}</div><div class="csub">SEDIA…</div>`; Snd.count();
  }, i*800));
  later(startShow, 2400);
}
function startShow(){
  setPhase('show'); Snd.show();
  $('#stage').innerHTML=`<div class="sword">TUNJUK!</div><div class="hold"><i></i></div><div class="csub">Tahan isyarat anda</div>`;
  later(reveal, 3000);
}
function reveal(){
  if(S.phase==='reveal') return;
  clearTimers(); setPhase('reveal'); Snd.reveal();
  const q=QUESTIONS[S.qi];
  $$('.opt').forEach(o=>o.classList.add(+o.dataset.i===q.ans?'right':'wrong'));
  $('#foot').innerHTML = `
    <div class="mark-row"><span class="ml">Tandakan peserta yang betul:</span>
      <div class="chips">${S.teams.map((t,i)=>`<button class="chip" data-i="${i}" style="--tc:${t.color}"><span class="dot"></span>${esc(t.name)}<span class="ck">✓</span></button>`).join('')}</div>
    </div>
    <span class="hint"><kbd>1</kbd>–<kbd>${S.teams.length}</kbd> tanda · <kbd>Space</kbd> papan</span>`;
  $$('.chip').forEach(c=>c.onclick=()=>toggleMark(+c.dataset.i));
}
function toggleMark(i){
  if(i<0||i>=S.teams.length) return;
  S.marks.has(i)?S.marks.delete(i):S.marks.add(i); Snd.click();
  $$('.chip')[i].classList.toggle('on', S.marks.has(i));
}

function commit(){
  const last=S.qi===QUESTIONS.length-1;
  S.prev=S.teams.map(t=>t.score); S.gain=S.teams.map(()=>0);
  S.teams.forEach((t,i)=>{
    if(S.marks.has(i)){
      t.streak++; t.correct++; t.best=Math.max(t.best,t.streak);
      let p=1000+Math.min(t.streak-1,5)*100; if(last) p*=2;
      t.score+=p; S.gain[i]=p;
    } else t.streak=0;
  });
}

/* ================= LEADERBOARD ================= */
const rankOrder = scores => scores.map((s,i)=>({s,i})).sort((a,b)=>b.s-a.s||a.i-b.i).map(o=>o.i);
function renderBoard(){
  S.screen='board'; clearTimers();
  const n=QUESTIONS.length, last=S.qi===n-1;
  const oldR=[], newR=[];
  rankOrder(S.prev).forEach((ti,r)=>oldR[ti]=r);
  rankOrder(S.teams.map(t=>t.score)).forEach((ti,r)=>newR[ti]=r);

  const right=S.marks.size, total=S.teams.length;
  const hot=S.teams.filter(t=>t.streak>=3).sort((a,b)=>b.streak-a.streak)[0];
  const callout = hot ? `🔥 ${esc(hot.name)} menjawab betul ${hot.streak} kali berturut-turut!`
    : right===0 ? 'Soalan mencabar! Tiada peserta yang menjawab betul.'
    : right===total ? 'Hebat! Semua peserta menjawab betul.'
    : `${right} daripada ${total} peserta menjawab betul.`;

  app.innerHTML = `
  <div class="screen lb">
    <div class="lbh"><h2>Papan Markah</h2><span>Selepas soalan ${S.qi+1} / ${n}</span></div>
    <div class="callout">${callout}</div>
    <div class="lbl" id="lbl" style="height:calc(${total} * (var(--rh) + 10px))">
      ${S.teams.map((t,i)=>`
        <div class="row r${oldR[i]}" data-i="${i}" style="--r:${oldR[i]};--tc:${t.color}">
          <div class="rk">${oldR[i]+1}</div><div class="sw"></div>
          <div class="nm">${esc(t.name)}${t.streak>=2?`<span class="stk">🔥 ${t.streak} berturut</span>`:''}</div>
          <div class="gn ${S.gain[i]?'':'zero'}">+${S.gain[i]}</div>
          <div class="sc">${S.prev[i]}</div>
        </div>`).join('')}
    </div>
    <div class="lbf"><span class="hint"><kbd>Space</kbd> ${last?'keputusan akhir':'soalan seterusnya'}</span></div>
  </div>`;
  Snd.whoosh();
  later(()=>{
    $('#lbl').classList.add('go');
    $$('.row').forEach(row=>{ const i=+row.dataset.i; countUp(row.querySelector('.sc'), S.prev[i], S.teams[i].score, 900); });
  }, 500);
  later(()=>{
    $$('.row').forEach(row=>{
      const i=+row.dataset.i;
      row.style.setProperty('--r', newR[i]);
      row.className=`row r${newR[i]}`;
      row.querySelector('.rk').textContent=newR[i]+1;
    });
  }, 1500);
}
function countUp(el, from, to, ms){
  if(from===to) return;
  const t0=performance.now();
  const step=now=>{ const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ================= FINAL ================= */
function renderFinal(){
  S.screen='final'; clearTimers();
  const order=rankOrder(S.teams.map(t=>t.score));
  // shared ranks: teams with equal scores get the same place (1, 1, 3 …)
  const place=t=>1+S.teams.filter(o=>o.score>t.score).length;
  const top=S.teams[order[0]].score;
  const tied=order.filter(ti=>S.teams[ti].score===top);
  const best=S.teams.slice().sort((a,b)=>b.best-a.best)[0];
  const acc=Math.round(S.teams.reduce((s,t)=>s+t.correct,0)/(S.teams.length*QUESTIONS.length)*100);
  const stats=`<div class="stats"><div>Ketepatan kelas: <b>${acc}%</b></div><div>Rentak terbaik: <b>${esc(best.name)} (${best.best})</b></div></div>`;
  const acts=`<div class="acts"><button class="btn primary" id="again">Main Semula</button><button class="btn" id="home">Laman Utama</button></div>`;

  if(tied.length>1){
    // SERI: two or more teams share first place
    const others=order.filter(ti=>S.teams[ti].score!==top);
    app.innerHTML = `
    <div class="screen fin seri">
      <div class="seri-word">SERI!</div>
      <div class="sub">${tied.length===S.teams.length?'Semua peserta':`${tied.length} peserta`} berkongsi tempat pertama dengan ${top} mata</div>
      <div class="tie">${tied.map((ti,i)=>{ const t=S.teams[ti]; return `
        <div class="tc" style="--tc:${t.color};animation-delay:${.5+i*.15}s"><div class="medal">1</div><div class="tn">${esc(t.name)}</div><div class="ts">${t.score} mata</div></div>`; }).join('')}</div>
      ${others.length?`<div class="rest">${others.map(ti=>{ const t=S.teams[ti]; return `<div>${place(t)}. ${esc(t.name)} · ${t.score}</div>`; }).join('')}</div>`:''}
      ${stats}${acts}
    </div>`;
  } else {
    const pod=[[1,'p2','var(--silver)','58%'],[0,'p1','var(--gold)','78%'],[2,'p3','var(--bronze)','42%']].filter(p=>order[p[0]]!==undefined);
    app.innerHTML = `
    <div class="screen fin">
      <h2>Keputusan Akhir</h2>
      <div class="sub">Tahniah kepada semua peserta!</div>
      <div class="pod">${pod.map(([r,cls,col,h])=>{ const t=S.teams[order[r]]; return `
        <div class="pc ${cls}"><div class="pn">${esc(t.name)}</div><div class="ps">${t.score} mata</div>
          <div class="pb" style="--pcol:${col};height:${h}">${place(t)}</div></div>`; }).join('')}</div>
      ${order.length>3?`<div class="rest">${order.slice(3).map(ti=>`<div>${place(S.teams[ti])}. ${esc(S.teams[ti].name)} · ${S.teams[ti].score}</div>`).join('')}</div>`:''}
      ${stats}${acts}
    </div>`;
  }
  $('#again').onclick=startGame; $('#home').onclick=renderLobby;
  later(()=>{ Snd.fanfare(); confetti(); }, 1500);
}
function confetti(){
  const cols=['#ffcf4a','#6d5cff','#3f7dff','#14b37d','#f0476b','#fff'];
  for(let i=0;i<90;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'vw'; d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.5+Math.random()*2.5)+'s'; d.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(),6500);
  }
}

/* ================= FLOW / KEYS ================= */
function next(){
  Snd.init();
  if(S.screen==='howto') return startGame();
  if(S.screen==='question'){
    if(S.phase==='think') return startCount();
    if(S.phase==='show')  return reveal();
    if(S.phase==='reveal'){ commit(); return renderBoard(); }
    return;
  }
  if(S.screen==='board'){
    if(S.qi>=QUESTIONS.length-1) return renderFinal();
    S.qi++; return renderQuestion();
  }
}
document.addEventListener('keydown', e=>{
  if(S.modal){ if(e.key==='Escape') closeEditor(); return; }
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  const k=e.key;
  if(S.screen!=='bank' && [' ','Enter','ArrowRight','PageDown'].includes(k)){ e.preventDefault(); next(); return; }
  if(k==='m'||k==='M') return toggleMute();
  if(k==='t'||k==='T') return toggleTheme();
  if(k==='f'||k==='F') return toggleFs();
  if((k==='p'||k==='P') && S.screen==='question' && S.phase==='think'){ S.paused=!S.paused; updateRing(); return; }
  if(/^[1-8]$/.test(k) && S.screen==='question' && S.phase==='reveal') toggleMark(+k-1);
});
// keep Space from re-clicking a focused button
document.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) b.blur(); });

/* boot: open the question bank (seed it with the starter questions on first visit), restore settings */
(async ()=>{
  await Store.open();
  try{
    if(!(await Store.get('seeded'))){ await Store.put(...seedDefaults()); await Store.set('seeded', true); await Store.set('seedVersion', SEED_VERSION); }
    else await migrateDefaults();
    BANK = await Store.all();
    const st = await Store.get('settings');
    if(st){
      if([10,15,20,30].includes(st.timer)) S.timer=st.timer;
      S.shuffle=!!st.shuffle;
      if(Array.isArray(st.teams) && st.teams.length>=2)
        S.teams=st.teams.slice(0,8).map((n,i)=>{ n=String(n||'').slice(0,18); return {...newTeam(i), input:OLD_DEFAULT_NAMES.includes(n)?'':n}; });
    }
  }catch(e){ BANK=seedDefaults(); }
  sortBank(); renderLobby();
})();
</script>
</body>
</html>
